<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한 단어 · Una palabra coreana</title>
<style>
  :root{
    --rojo:#CD2E3A;
    --rojo-hover:#A8262F;
    --azul:#0047A0;
    --azul-hover:#00347A;
    --blanco:#FFFFFF;
    --negro:#000000;
    --texto:#14181F;
    --texto-suave:#5A6270;
    --borde:#E2E6EC;
    --borde-fuerte:#C9D0DA;
    --fondo:#F7F9FC;
    --rojo-suave:#FBECEE;
    --azul-suave:#EAF1F9;
    --radio:16px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    background:var(--blanco);
    color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .barra{
    height:4px;
    background:linear-gradient(90deg,var(--rojo) 0%,var(--rojo) 50%,var(--azul) 50%,var(--azul) 100%);
  }

  .envoltorio{
    max-width:860px;
    margin:0 auto;
    padding:28px 20px 48px;
  }

  /* ---------- Encabezado ---------- */
  .cabecera{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }

  .titulo{
    display:flex;
    align-items:center;
    gap:11px;
  }

  .titulo h1{
    font-size:1.45rem;
    font-weight:700;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }

  .titulo .sub{
    display:block;
    font-size:0.82rem;
    font-weight:400;
    color:var(--texto-suave);
    letter-spacing:0;
  }

  /* ---------- Taegeuk ---------- */
  .taegeuk{
    position:relative;
    width:30px;
    height:30px;
    flex:none;
    border-radius:50%;
    background:conic-gradient(from -90deg,var(--rojo) 0deg 180deg,var(--azul) 180deg 360deg);
    overflow:hidden;
  }
  .taegeuk::before,
  .taegeuk::after{
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
  }
  .taegeuk::before{top:0;left:7.5px;background:var(--rojo)}
  .taegeuk::after{bottom:0;left:7.5px;background:var(--azul)}

  /* ---------- Marcador ---------- */
  .marcador{
    margin-left:auto;
    display:flex;
    gap:8px;
  }
  .pastilla{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--borde);
    border-radius:999px;
    padding:5px 13px;
    font-size:0.83rem;
    font-weight:600;
    background:var(--blanco);
    white-space:nowrap;
  }
  .pastilla .pt{
    width:8px;height:8px;border-radius:50%;
  }
  .pastilla.acierto .pt{background:var(--azul)}
  .pastilla.fallo .pt{background:var(--rojo)}
  .pastilla .n{
    font-variant-numeric:tabular-nums;
    color:var(--texto-suave);
    font-weight:700;
  }

  /* ---------- Filtros ---------- */
  .filtros{
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:24px;
    scrollbar-width:thin;
  }
  .filtros::-webkit-scrollbar{height:6px}
  .filtros::-webkit-scrollbar-thumb{background:var(--borde-fuerte);border-radius:3px}

  .chip{
    flex:none;
    border:1px solid var(--borde);
    background:var(--blanco);
    color:var(--texto-suave);
    border-radius:999px;
    padding:7px 15px;
    font:inherit;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{background:var(--fondo);border-color:var(--borde-fuerte);color:var(--texto)}
  .chip[aria-pressed="true"]{
    background:var(--azul);
    border-color:var(--azul);
    color:var(--blanco);
  }

  /* ---------- Tarjeta ---------- */
  .tarjeta{
    position:relative;
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:34px 30px 30px;
    text-align:center;
    background:var(--blanco);
    box-shadow:0 1px 2px rgba(0,71,160,.04),0 12px 32px -18px rgba(0,71,160,.28);
    overflow:hidden;
    min-height:352px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
  }
  .tarjeta::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:linear-gradient(180deg,var(--rojo) 0%,var(--rojo) 45%,var(--azul) 55%,var(--azul) 100%);
  }

  .categoria{
    display:inline-block;
    background:var(--azul);
    color:var(--blanco);
    border-radius:999px;
    padding:5px 14px;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.13em;
    text-transform:uppercase;
    margin-bottom:26px;
  }

  .hangul{
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Nanum Gothic","Segoe UI",sans-serif;
    font-size:4.4rem;
    font-weight:700;
    line-height:1.18;
    letter-spacing:0.01em;
    color:var(--texto);
    word-break:keep-all;
  }

  .romanizacion{
    margin-top:14px;
    font-size:1.55rem;
    font-weight:600;
    color:var(--azul);
    letter-spacing:0.01em;
  }

  .silabas{
    margin-top:8px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:0.95rem;
    color:var(--texto-suave);
    letter-spacing:0.04em;
  }

  .trigramas{
    margin:26px 0;
    color:var(--negro);
    opacity:.1;
    font-size:1.05rem;
    letter-spacing:0.5em;
    text-indent:0.5em;
  }

  .traduccion{
    font-size:2.35rem;
    font-weight:700;
    color:var(--texto);
    animation:aparecer .28s ease both;
  }
  .traduccion[hidden]{display:none}

  @keyframes aparecer{
    from{opacity:0;transform:translateY(-7px)}
    to{opacity:1;transform:none}
  }

  /* ---------- Botones ---------- */
  .acciones{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:22px;
    flex-wrap:wrap;
  }

  button{font:inherit}

  .btn{
    border:1px solid transparent;
    border-radius:11px;
    padding:13px 24px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .btn:focus-visible{
    outline:3px solid rgba(0,71,160,.35);
    outline-offset:2px;
  }

  .btn-azul{background:var(--azul);color:var(--blanco)}
  .btn-azul:hover{background:var(--azul-hover)}

  .btn-rojo{background:var(--rojo);color:var(--blanco)}
  .btn-rojo:hover{background:var(--rojo-hover)}

  .btn-linea{
    background:var(--blanco);
    border-color:var(--borde-fuerte);
    color:var(--texto);
  }
  .btn-linea:hover{background:var(--fondo);border-color:var(--texto-suave)}

  .btn-eval{
    background:var(--blanco);
    padding:11px 20px;
    font-size:0.88rem;
  }
  .btn-acierto{
    border-color:var(--azul);
    color:var(--azul);
  }
  .btn-acierto:hover{background:var(--azul);color:var(--blanco)}
  .btn-fallo{
    border-color:var(--rojo);
    color:var(--rojo);
  }
  .btn-fallo:hover{background:var(--rojo);color:var(--blanco)}

  .evaluacion{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .evaluacion[hidden]{display:none}

  .pista{
    text-align:center;
    margin-top:20px;
    font-size:0.8rem;
    color:var(--texto-suave);
  }
  .pista kbd{
    font-family:inherit;
    font-size:0.74rem;
    background:var(--fondo);
    border:1px solid var(--borde);
    border-bottom-width:2px;
    border-radius:5px;
    padding:1px 6px;
    color:var(--texto);
  }

  .pie{
    text-align:center;
    margin-top:38px;
    font-size:0.76rem;
    color:var(--texto-suave);
  }
  .pie .gwae{
    display:block;
    margin-bottom:8px;
    color:var(--negro);
    opacity:.12;
    letter-spacing:0.7em;
    text-indent:0.7em;
  }

  @media (max-width:560px){
    .envoltorio{padding:20px 14px 36px}
    .hangul{font-size:3.1rem}
    .romanizacion{font-size:1.25rem}
    .traduccion{font-size:1.75rem}
    .marcador{margin-left:0;width:100%}
    .tarjeta{padding:28px 20px 26px}
    .acciones .btn{flex:1 1 100%}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>

/* ============================================================
   Lógica
   ============================================================ */

const el = {
  filtros:      document.getElementById("filtros"),
  categoria:    document.getElementById("categoria"),
  hangul:       document.getElementById("hangul"),
  romanizacion: document.getElementById("romanizacion"),
  silabas:      document.getElementById("silabas"),
  traduccion:   document.getElementById("traduccion"),
  btnNueva:     document.getElementById("btnNueva"),
  btnTraducir:  document.getElementById("btnTraducir"),
  btnSi:        document.getElementById("btnSi"),
  btnNo:        document.getElementById("btnNo"),
  evaluacion:   document.getElementById("evaluacion"),
  aciertos:     document.getElementById("aciertos"),
  fallos:       document.getElementById("fallos")
};

const RANGOS = Object.fromEntries(CATEGORIAS.map(c => [c[0], c[1]]));

let categoriaActual = "todas";
let bolsa = [];          // bolsa barajada de palabras
let indice = 0;          // posición dentro de la bolsa
let aciertos = 0;
let fallos = 0;
let evaluada = false;

const todas = () =>
  categoriaActual === "todas"
    ? Object.values(PALABRAS).flat()
    : PALABRAS[categoriaActual];

function barajar(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function siguiente(){
  const lista = todas();
  if(lista.length === 0) return null;
  if(indice >= bolsa.length){
    bolsa = barajar(lista);
    indice = 0;
  }
  return bolsa[indice++];
}

function pintar(palabra){
  if(!palabra){
    el.categoria.textContent    = "—";
    el.hangul.textContent       = "Sin palabras";
    el.romanizacion.textContent = "";
    el.silabas.textContent      = "";
    el.traduccion.hidden        = true;
    return;
  }
  const [h, r, s] = palabra;
  el.categoria.textContent    = categoriaActual === "todas" ? "Todas" : RANGOS[categoriaActual];
  el.hangul.textContent       = h;
  el.romanizacion.textContent = r;
  el.silabas.textContent      = s;
  el.traduccion.hidden        = true;
  el.traduccion.textContent   = palabra[3];
  evaluada = false;
  el.btnTraducir.textContent = "Mostrar traducción";
  el.evaluacion.hidden = true;
}

function nueva(){
  pintar(siguiente());
}

function mostrar(){
  if(el.traduccion.hidden){
    el.traduccion.hidden = false;
    el.btnTraducir.textContent = "Ocultar traducción";
    el.evaluacion.hidden = evaluada;
  }
}

function calificar(acierto){
  if(evaluada) return;
  evaluada = true;
  if(acierto) aciertos++; else fallos++;
  el.aciertos.textContent = aciertos;
  el.fallos.textContent = fallos;
  el.evaluacion.hidden = true;
  nueva();
}

/* ---------- Filtros ---------- */

function crearFiltros(){
  const todos = document.createElement("button");
  todos.className = "chip";
  todos.textContent = "Todas";
  todos.dataset.cat = "todas";
  todos.setAttribute("aria-pressed", "true");
  el.filtros.appendChild(todos);

  CATEGORIAS.forEach(([clave, etiqueta]) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = etiqueta;
    b.dataset.cat = clave;
    b.setAttribute("aria-pressed", "false");
    el.filtros.appendChild(b);
  });

  el.filtros.addEventListener("click", ev => {
    const chip = ev.target.closest(".chip");
    if(!chip) return;
    categoriaActual = chip.dataset.cat;
    el.filtros.querySelectorAll(".chip").forEach(c =>
      c.setAttribute("aria-pressed", String(c === chip)));
    bolsa = [];
    indice = 0;
    nueva();
  });
}

/* ---------- Eventos ---------- */

el.btnNueva.addEventListener("click", nueva);
el.btnTraducir.addEventListener("click", () => {
  if(el.traduccion.hidden) mostrar();
  else{
    el.traduccion.hidden = true;
    el.btnTraducir.textContent = "Mostrar traducción";
  }
});
el.btnSi.addEventListener("click", () => calificar(true));
el.btnNo.addEventListener("click", () => calificar(false));

document.addEventListener("keydown", ev => {
  if(ev.target.closest("button, input, textarea, select, a")) return;
  if(ev.code === "Space"){
    ev.preventDefault();
    nueva();
  } else if(ev.key === "Enter"){
    ev.preventDefault();
    if(el.traduccion.hidden) mostrar();
  }
});

/* ---------- Arranque ---------- */

crearFiltros();
nueva();
